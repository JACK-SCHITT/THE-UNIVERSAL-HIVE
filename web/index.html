<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#8fa87a"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>THE UNIVERSAL HIVE</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <style>
    :root { --ink:#0c0d0b; --moss:#8fa87a; --paper:#eeeee6; }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--ink); color:var(--paper); font:15px/1.4 ui-monospace,Menlo,Consolas,monospace; }
    header { padding:16px; border-bottom:1px solid #222; }
    h1 { margin:0; font-size:16px; letter-spacing:.08em; color:var(--moss); }
    .law { color:#bbb; font-size:12px; margin-top:6px; }
    main { padding:16px; max-width:720px; }
    textarea,input,button { width:100%; background:#141513; color:var(--paper); border:1px solid #333; padding:10px; font:inherit; }
    button { background:var(--moss); color:var(--ink); font-weight:700; margin-top:8px; cursor:pointer; }
    pre { white-space:pre-wrap; background:#141513; padding:12px; min-height:8em; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    .hint { color:#888; font-size:12px; margin-top:12px; }
  </style>
</head>
<body>
<header>
  <h1>THE UNIVERSAL HIVE</h1>
  <div class="law">Provide for all. Find the good. Never limit unnecessarily.</div>
</header>
<main>
  <div class="row">
    <input id="agent" value="base" placeholder="agent id"/>
    <input id="child" value="sub1" placeholder="new sub-agent id"/>
  </div>
  <textarea id="prompt" rows="4">Who are you?</textarea>
  <button id="go">GENERATE</button>
  <button id="spawn">SPAWN SUB-AGENT (base only)</button>
  <button id="install">INSTALL / PAIR HINTS</button>
  <pre id="out">ready. add to home screen on phone. same-Wi-Fi hits /api/generate.</pre>
  <p class="hint">AirDrop / Wi-Fi Direct / NFC are OS channels — not faked here. USB = tether then open this URL.</p>
</main>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
const out = document.getElementById("out");
document.getElementById("go").onclick = async () => {
  const body = { agent: document.getElementById("agent").value || "base", prompt: document.getElementById("prompt").value };
  try {
    const r = await fetch("/api/generate", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
    out.textContent = JSON.stringify(await r.json(), null, 2);
  } catch (e) {
    out.textContent = "no local node. law still holds.\n" + body.prompt;
  }
};
document.getElementById("spawn").onclick = async () => {
  const body = { parent: document.getElementById("agent").value || "base", child: document.getElementById("child").value || "sub" };
  try {
    const r = await fetch("/api/spawn", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
    out.textContent = JSON.stringify(await r.json(), null, 2);
  } catch (e) {
    out.textContent = "spawn needs serve.py. child born on BASE_SEED only.";
  }
};
document.getElementById("install").onclick = () => {
  out.textContent = "PHONE: Add to Home Screen.\nLAN: python3 seed/serve.py --host 0.0.0.0 --port 8787\nUSB: tether then open http://<pc-ip>:8787\nQR tap that URL.\nAirDrop = iOS share of URL, not a web radio.";
};
</script>
</body>
</html>
