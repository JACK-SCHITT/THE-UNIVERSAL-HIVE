<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DRAGONFLY — demo</title>
<style>
  body { margin:0; background:#10140f; color:#d7e2cf; font:15px/1.4 ui-monospace,monospace; }
  main { max-width:720px; margin:0 auto; padding:24px; }
  .mark { color:#9fb56a; }
  .glass { border:1px solid #3c4634; background:#182017; padding:16px; }
  svg { width:100%; height:220px; background:#121a12; }
  footer { color:#8a8a82; font-size:13px; margin-top:28px; }
</style>
</head>
<body>
<main>
  <p class="mark">DRAGONFLY · ground station · demo</p>
  <h1>Plan view. No link.</h1>
  <div class="glass">
    <svg viewBox="0 0 320 180" aria-label="dragonfly plan mark">
      <ellipse cx="160" cy="90" rx="18" ry="70" fill="none" stroke="#9fb56a" />
      <ellipse cx="110" cy="70" rx="48" ry="16" fill="none" stroke="#9fb56a" transform="rotate(-18 110 70)" />
      <ellipse cx="210" cy="70" rx="48" ry="16" fill="none" stroke="#9fb56a" transform="rotate(18 210 70)" />
      <ellipse cx="120" cy="120" rx="36" ry="12" fill="none" stroke="#6e8458" transform="rotate(16 120 120)" />
      <ellipse cx="200" cy="120" rx="36" ry="12" fill="none" stroke="#6e8458" transform="rotate(-16 200 120)" />
    </svg>
    <p>Follow-me ground station shell. Map is painted. No GPS feed. No aircraft. Not connected.</p>
  </div>
  <footer>Architect: Kracker Jack · copyright 2026 · demo only · no phone-home</footer>
</main>
<script src="../gate.js"></script>
</body>
</html>
