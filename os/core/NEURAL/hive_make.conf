# HIVE-OS (Gentoo Core) — Portage DNA
# Deploy target: /etc/portage/make.conf (inside chroot / live node)
# Architect: KRACKERJACK1134

COMMON_FLAGS="-O2 -pipe -march=native"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Focused USE: no desktop bloat, no systemd, no telemetry surface
USE="\
 -bluetooth -cups -systemd -gnome -kde -nls -ipv6 \
 -telemetry hardened openssl \
 python git curl \
"

MAKEOPTS="-j$(nproc)"
ACCEPT_LICENSE="*"
ACCEPT_KEYWORDS="amd64"

# Adapt VIDEO_CARDS to hardware before world emerge
VIDEO_CARDS="intel nvidia radeon"

# Input method / locale minimal
INPUT_DEVICES="libinput"
LINGUAS="en"

# Hive identity tag (comment only — not consumed by Portage)
# NODE: HIVE-NODE-01 | INIT: OpenRC | SHIELD: hardened profile
